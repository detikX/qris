<!DOCTYPE html>
<html>

<head>
    <title>Leaflet Satellite Map</title>
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .leaflet-container {
            height: 100vh;
            width: 100vw;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Include Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // 1. Initialize the map
        const map = L.map('map').setView([-6.462654876950736, 106.81641975947225], 18.5);

        // 2. Define the Esri Satellite Tile URL and Attribution
        const esriSatelliteUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        const esriSatelliteAttrib = 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community';

        // 3. Create the tile layer and add it to the map
        const satelliteLayer = L.tileLayer(esriSatelliteUrl, {
            attribution: esriSatelliteAttrib,
            maxZoom: 19
        });


        var bounds = [
             [-6.463558496233696, 106.81509654322322],
        [-6.462891210560377, 106.81512142137477],
        [-6.462236288133717, 106.81621581112067],
        [-6.461630791192956, 106.81645831767013],
        [-6.461711115533864, 106.81759622128966],
        [-6.462798538954838, 106.81772679937407],
        [-6.4632433942404495, 106.81801282980824]
        ]
        var dashedRectangle = L.polygon(bounds, {
            color: "#ff7800",
            weight: 3,
                  fillColor: '#f03',
            fillOpacity: 0.05,
            dashArray: '10, 10' // Defines the dash pattern (10px stroke, 10px space)
        }).addTo(map);

//         -6.463461948503009, 106.81577181466197

// -6.463433789763121, 106.81595756373244

// -6.463321423590491, 106.81594657043236

// -6.463377862036328, 106.81577650780835

  const vilamini = L.polygon([
        [-6.463461948503009, 106.81577181466197],
[-6.463433789763121, 106.81595756373244],
[-6.463321423590491, 106.81594657043236],
[-6.463377862036328, 106.81577650780835]
        ]).addTo(map).bindPopup('Vila Mini SAE Atas.');

        // const polygon = L.polygon([
        //     [-6.461878453645719, 106.81750334055495],
        //     [-6.461886526326529, 106.81724608323127],
        //     [-6.462327812175182, 106.81714047247708]
        // ]).addTo(map).bindPopup('I am a polygon.');

        const polygonx = L.polygon([
            [-6.463131533339685, 106.81726996632185],
            [-6.462982858331127, 106.81744599647081],
            [-6.462828353464142, 106.81735211322881],
            [-6.46302075635447, 106.81713794333879]
        ], {
            color: 'red'
        }).addTo(map).bindPopup('Ruang Kalapas');


        const sae_bawah = L.polygon([
            [-6.463678154629112, 106.81561858871453],

            [-6.463726127225105, 106.81523234932885],

            [-6.463544895901523, 106.81524307872542],

            [-6.463566217610406, 106.81555958018765],
        ], {
            color: 'green'
        }).addTo(map).bindPopup('SAE Bawah');

        const gereja_sambo = L.polygon([
            [-6.462331187283382, 106.81736198388705],

            [-6.462418545241775, 106.8173619838979],
            [-6.4624083533875405, 106.81752756013026],

            [-6.462310803665511, 106.8175099767848],

        ], {
            color: 'green'
        }).addTo(map).bindPopup('Gereja Sambo');

        // -6.463726127225105, 106.81523234932885

        satelliteLayer.addTo(map);

</body>

</html>
